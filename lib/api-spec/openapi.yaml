openapi: 3.0.0
info:
  title: API
  version: 1.0.0
paths:
  /plans:
    get:
      summary: Get all plans
      responses:
        '200':
          description: A list of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Plan'
  /join:
    post:
      summary: Join a plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinRequest'
      responses:
        '200':
          description: Successfully joined the plan
        '400':
          description: Invalid request or no spots available
components:
  schemas:
    Plan:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        date:
          type: string
        time:
          type: string
        location:
          type: string
        image:
          type: string
        availableCupos:
          type: number
        totalCupos:
          type: number
        category:
          type: string
        createdAt:
          type: string
          format: date-time
    JoinRequest:
      type: object
      required:
        - planId
        - userId
      properties:
        planId:
          type: string
        userId:
          type: string

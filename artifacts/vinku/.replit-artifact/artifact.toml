kind = "web"
previewPath = "/"
title = "Vinku"
version = "1.0.0"
id = "artifacts/vinku"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23342

[services.development]
run = "pnpm --filter @workspace/vinku run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vinku", "run", "build" ]
publicDir = "artifacts/vinku/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23342"
BASE_PATH = "/"
